version: '3.8'
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: djcsvimportdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    command: bash -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./src:/app/src:cached
    working_dir: /app/src
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/djcsvimportdb
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=src_package.settings
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    command: bash -lc "celery -A src_package worker --loglevel=info"
    volumes:
      - ./src:/app/src:cached
    working_dir: /app/src
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/djcsvimportdb
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=src_package.settings
    depends_on:
      - redis
      - db

volumes:
  db_data:
