services:
  db:
    image: postgres:latest
    env_file:
      - ../.env
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    entrypoint: ["/app/entrypoint.sh"]
    command: ["sh", "-c", "gunicorn src_package.wsgi:application --bind 0.0.0.0:$${GUNICORN_PORT:-8000} --workers $${GUNICORN_WORKERS:-3} --threads $${GUNICORN_THREADS:-2} --timeout $${GUNICORN_TIMEOUT:-120} --access-logfile '-' --error-logfile '-'"]
    volumes:
      - ../src:/app/src:cached
      - ../src/media:/app/src/media
    working_dir: /app/src
    environment:
      - RUN_MIGRATIONS=1
      - RUN_COLLECTSTATIC=0
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    command: ["sh", "-c", "celery -A src_package worker -Q $${CELERY_QUEUES:-import} --concurrency=$${CELERY_CONCURRENCY:-4} --loglevel=$${CELERY_LOGLEVEL:-info} --autoscale=$${CELERY_AUTOSCALE:-10,2}"]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "celery -A src_package inspect ping -d 5 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ../src:/app/src:cached
      - ../src/media:/app/src/media
    working_dir: /app/src
    env_file:
      - ../.env
    depends_on:
      - redis
      - db

  flower:
    image: mher/flower
    env_file:
      - ../.env
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  db_data:
